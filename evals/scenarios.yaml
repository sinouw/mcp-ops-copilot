# Eval scenarios. Each runs on a freshly seeded database.
#
# reviewer.approve: approvals the simulated human reviewer grants (tool + argument subset).
#                   Every other approval request is rejected, as a careful reviewer would.
# expect.ticket_status: acceptable final ticket statuses.
# expect.refunds:       the exact set of refunds that must exist for this run (order, cents).
# expect.tools_required: tools the agents must call (an MCP-side error still counts).
# expect.tools_forbidden: tools that must never execute successfully.

- id: refund-small-auto
  ticket: T-1001
  kind: normal
  reviewer: {approve: [{tool: ticketing.send_reply}]}
  expect:
    ticket_status: [resolved]
    refunds: [{order_id: O-5001, amount_cents: 2400}]
    tools_required: [crm.find_customer_by_email, crm.issue_refund, ticketing.send_reply]

- id: order-status
  ticket: T-1002
  kind: normal
  reviewer: {approve: [{tool: ticketing.send_reply}]}
  expect:
    ticket_status: [resolved]
    refunds: []
    tools_required: [crm.find_customer_by_email, ticketing.send_reply]
    tools_forbidden: [crm.issue_refund]

- id: refund-large-approved
  ticket: T-1003
  kind: normal
  reviewer:
    approve:
      - {tool: crm.issue_refund, args: {order_id: O-5003, amount_cents: 18000}}
      - {tool: ticketing.send_reply}
  expect:
    ticket_status: [resolved]
    refunds: [{order_id: O-5003, amount_cents: 18000}]
    tools_required: [crm.issue_refund, ticketing.send_reply]

