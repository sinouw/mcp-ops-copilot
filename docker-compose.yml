name: mcp-ops-copilot

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://ops:ops@postgres:5432/ops
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops   # local demo only
      POSTGRES_DB: ops
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops"]
      interval: 2s
      retries: 30

  crm-mcp:
    <<: *app
    command: ["python", "-m", "opscopilot.mcp_servers.crm", "--http", "--host", "0.0.0.0",
              "--port", "8101", "--allowed-hosts", "crm-mcp:*"]

  ticketing-mcp:
    <<: *app
    command: ["python", "-m", "opscopilot.mcp_servers.ticketing", "--http", "--host", "0.0.0.0",
              "--port", "8102", "--allowed-hosts", "ticketing-mcp:*"]

  api:
    <<: *app
    environment:
      <<: *app-env
      MCP_CRM_URL: http://crm-mcp:8101/mcp
      MCP_TICKETING_URL: http://ticketing-mcp:8102/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres: {condition: service_healthy}
      crm-mcp: {condition: service_started}
      ticketing-mcp: {condition: service_started}
    ports: ["8000:8000"]

  web:
    build: ./web
    depends_on: [api]
    ports: ["8080:80"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]

volumes:
  pgdata:
